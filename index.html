<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Shorts Aman</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2A4A">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shorts Aman">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --ink: #1B2A4A;
    --ink-2: #263C63;
    --sun: #FFC857;
    --coral: #FF6B6B;
    --cream: #FFF8ED;
    --sage: #6FCF97;
    --slate: #8B95A5;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--ink);
    font-family:'Inter',sans-serif;
    color:var(--cream);
    overscroll-behavior:none;
  }
  h1,h2,h3,.display{ font-family:'Fredoka',sans-serif; }

  /* ---------- Kid feed ---------- */
  #feed{
    height:100vh;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
    scrollbar-width:none;
  }
  #feed::-webkit-scrollbar{display:none;}
  .slide{
    height:100vh;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    position:relative;
    background:#000;
  }
  .slide iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
    z-index:2;
  }
  .badge{
    position:absolute;
    top:16px; left:16px;
    background:rgba(27,42,74,0.85);
    border:1.5px solid var(--sage);
    color:var(--sage);
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:6px 12px 6px 10px;
    border-radius:20px;
    display:flex; align-items:center; gap:6px;
    backdrop-filter:blur(4px);
  }
  .badge .dot{width:7px;height:7px;border-radius:50%;background:var(--sage);}
  .dots{
    position:absolute;
    right:10px; top:50%;
    transform:translateY(-50%);
    display:flex; flex-direction:column; gap:6px;
  }
  .dots .d{
    width:5px; height:5px; border-radius:50%;
    background:rgba(255,255,255,0.3);
  }
  .dots .d.active{ background:var(--sun); height:18px; border-radius:4px; }
  .dots-track{
    position:absolute; right:14px; top:50%; transform:translateY(-50%);
    height:140px; width:4px; background:rgba(255,255,255,0.18); border-radius:4px;
  }
  .dots-marker{
    position:absolute; left:-3px; width:10px; height:16px; border-radius:4px;
    background:var(--sun); transform:translateY(-50%);
  }
  .slide .thumb{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    z-index:1;
  }

  /* ---------- Empty state ---------- */
  .empty{
    height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:32px; gap:14px;
  }
  .empty .emoji{ font-size:56px; }
  .empty h2{ font-size:24px; margin:0; color:var(--cream); }
  .empty p{ color:var(--slate); font-size:14px; max-width:280px; line-height:1.5; margin:0;}

  /* ---------- Lock button ---------- */
  #lockBtn{
    position:fixed; bottom:22px; right:18px;
    width:46px; height:46px; border-radius:50%;
    background:var(--ink-2); border:1.5px solid rgba(255,255,255,0.15);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; cursor:pointer; z-index:50;
    box-shadow:0 4px 14px rgba(0,0,0,0.35);
  }

  /* ---------- Sound toggle ---------- */
  #soundBtn{
    position:fixed; top:16px; right:16px;
    width:40px; height:40px; border-radius:50%;
    background:rgba(27,42,74,0.75); border:1.5px solid rgba(255,255,255,0.15);
    display:flex; align-items:center; justify-content:center;
    font-size:17px; cursor:pointer; z-index:50;
    backdrop-filter:blur(4px);
  }

  /* ---------- Overlay ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(10,15,28,0.72);
    backdrop-filter:blur(3px);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:100;
  }
  .sheet{
    width:100%; max-width:480px;
    background:var(--cream); color:var(--ink);
    border-radius:24px 24px 0 0;
    padding:24px 20px calc(24px + env(safe-area-inset-bottom));
    max-height:88vh; overflow-y:auto;
    animation:slideUp .25s ease-out;
  }
  @keyframes slideUp{ from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .sheet h2{ margin:0 0 4px; font-size:22px; color:var(--ink);}
  .sheet .sub{ color:#6b7688; font-size:13px; margin:0 0 18px; }

  .pin-dots{ display:flex; gap:14px; justify-content:center; margin:24px 0; }
  .pin-dots span{ width:16px; height:16px; border-radius:50%; border:2px solid var(--ink); }
  .pin-dots span.filled{ background:var(--coral); border-color:var(--coral); }
  .keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:260px; margin:0 auto; }
  .keypad button{
    padding:16px 0; font-size:20px; font-family:'Fredoka',sans-serif; font-weight:600;
    border:none; border-radius:14px; background:#fff; color:var(--ink);
    box-shadow:0 2px 0 rgba(0,0,0,0.06);
  }
  .keypad button:active{ background:#eee; }
  .keypad .wide{ grid-column:span 1; }

  label{ font-size:13px; font-weight:600; color:var(--ink-2); display:block; margin-bottom:6px;}
  input[type=text]{
    width:100%; padding:13px 14px; border-radius:12px;
    border:1.5px solid #E3DECF; font-size:15px; font-family:'Inter',sans-serif;
    margin-bottom:12px; background:#fff;
  }
  input[type=text]:focus{ outline:2px solid var(--coral); border-color:transparent; }
  .btn-primary{
    width:100%; padding:14px; border:none; border-radius:14px;
    background:var(--coral); color:#fff; font-family:'Fredoka',sans-serif;
    font-weight:600; font-size:15px; cursor:pointer; margin-bottom:8px;
  }
  .btn-ghost{
    width:100%; padding:12px; border:none; background:transparent;
    color:var(--slate); font-size:13px; cursor:pointer; text-align:center;
  }
  .err{ color:var(--coral); font-size:13px; text-align:center; min-height:18px; margin-top:-6px; }

  .video-item{
    display:flex; gap:12px; align-items:center;
    padding:10px; border-radius:14px; background:#fff;
    border:1px solid #EEE7D6; margin-bottom:10px;
  }
  .video-item img{ width:64px; height:44px; object-fit:cover; border-radius:8px; flex-shrink:0; background:#ddd;}
  .video-item .vid-id{ font-size:12px; color:#6b7688; font-family:monospace; }
  .video-item button{
    margin-left:auto; background:none; border:none; color:var(--coral);
    font-size:18px; cursor:pointer; padding:6px;
  }
  .list-title{ display:flex; align-items:center; justify-content:between; margin:18px 0 10px;}
  .list-title span{ font-size:13px; font-weight:700; color:var(--ink-2); }
  .close-x{
    position:absolute; top:14px; right:16px; background:none; border:none;
    font-size:22px; color:#999; cursor:pointer;
  }
  .sheet-head{ position:relative; }
  .hint{ font-size:12px; color:#9098a5; margin:-6px 0 14px; line-height:1.5; }

  /* ---------- Time limit ---------- */
  .section-label{ font-size:13px; font-weight:700; color:var(--ink-2); margin:18px 0 10px; }
  .preset-row{ display:flex; gap:8px; margin-bottom:14px; }
  .preset-btn{
    flex:1; padding:10px 0; border-radius:12px; border:1.5px solid #E3DECF;
    background:#fff; color:var(--ink); font-family:'Fredoka',sans-serif;
    font-weight:600; font-size:14px; cursor:pointer;
  }
  .preset-btn.active{ background:var(--coral); border-color:var(--coral); color:#fff; }
  .progress-wrap{
    background:#EFE9DA; border-radius:20px; padding:14px 16px; margin-bottom:14px;
  }
  .progress-text{ font-size:13px; color:var(--ink-2); font-weight:600; margin-bottom:8px; }
  .progress-bar-bg{ background:#DCD5C2; border-radius:8px; height:10px; overflow:hidden; }
  .progress-bar-fill{ background:var(--sage); height:100%; border-radius:8px; transition:width .3s; }
  .progress-bar-fill.over{ background:var(--coral); }
  .quick-add-btn{
    width:100%; padding:12px; border-radius:12px; border:1.5px dashed var(--sage);
    background:#F2FBF6; color:#2f9e63; font-family:'Fredoka',sans-serif;
    font-weight:600; font-size:14px; cursor:pointer; margin-bottom:6px;
  }

  /* ---------- Locked screen ---------- */
  .locked .emoji{ font-size:56px; }

  /* ---------- Install button ---------- */
  #installBtn{
    position:fixed; bottom:22px; left:18px;
    padding:12px 16px; border-radius:24px;
    background:var(--sun); color:var(--ink); border:none;
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:13px;
    cursor:pointer; z-index:50; box-shadow:0 4px 14px rgba(0,0,0,0.35);
  }

  /* ---------- Channel import ---------- */
  .status-text{ font-size:13px; color:var(--ink-2); min-height:18px; margin:8px 0 4px; }
  .status-text.error{ color:var(--coral); }
  .status-text.success{ color:#2f9e63; }
  .channel-item{
    display:flex; gap:10px; align-items:center;
    padding:10px 12px; border-radius:14px; background:#fff;
    border:1px solid #EEE7D6; margin-bottom:8px;
  }
  .channel-item .ch-title{ font-size:13px; font-weight:600; color:var(--ink); flex:1; }
  .channel-item .ch-sub{ font-size:11px; color:#9098a5; }
  .channel-item button{
    background:none; border:none; font-size:15px; cursor:pointer; padding:6px;
  }
  .btn-secondary{
    width:100%; padding:13px; border-radius:12px; border:1.5px solid var(--ink);
    background:#fff; color:var(--ink); font-family:'Fredoka',sans-serif;
    font-weight:600; font-size:14px; cursor:pointer; margin-bottom:8px;
  }

  /* ---------- End of list card ---------- */
  .end-slide{ height:100vh; scroll-snap-align:start; scroll-snap-stop:always; display:flex; align-items:center; justify-content:center; }
  .end-slide .replay-btn{
    margin-top:8px; padding:12px 22px; border-radius:24px; border:none;
    background:var(--sun); color:var(--ink); font-family:'Fredoka',sans-serif;
    font-weight:600; font-size:14px; cursor:pointer;
  }
</style>
</head>
<body>

<div id="feed"></div>

<button id="lockBtn" title="Mode Orang Tua">🔒</button>
<button id="soundBtn" title="Suara">🔇</button>
<button id="installBtn" title="Instal Aplikasi" style="display:none;">📲 Instal Aplikasi</button>

<div id="overlayRoot"></div>

<script>
const SHARED = true; // kept for readability; storage below is plain browser localStorage

// ---------- storage helpers (localStorage-based, fully standalone) ----------
async function getVal(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    return raw !== null ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
async function setVal(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }
  catch(e){ console.error('storage set failed', e); }
}

// ---------- youtube id extraction ----------
function extractId(url){
  const patterns = [
    /shorts\/([a-zA-Z0-9_-]{11})/,
    /youtu\.be\/([a-zA-Z0-9_-]{11})/,
    /v=([a-zA-Z0-9_-]{11})/,
    /embed\/([a-zA-Z0-9_-]{11})/
  ];
  for(const p of patterns){
    const m = url.match(p);
    if(m) return m[1];
  }
  if(/^[a-zA-Z0-9_-]{11}$/.test(url.trim())) return url.trim();
  return null;
}

// ---------- YouTube Data API: channel import ----------
function parseISODuration(iso){
  const m = (iso || '').match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if(!m) return 9999;
  const h = parseInt(m[1] || 0, 10), mnt = parseInt(m[2] || 0, 10), s = parseInt(m[3] || 0, 10);
  return h * 3600 + mnt * 60 + s;
}

async function apiGet(url){
  const key = await getVal('youtube-api-key', '');
  if(!key) throw new Error('NO_KEY');
  const sep = url.includes('?') ? '&' : '?';
  const res = await fetch(`${url}${sep}key=${key}`);
  const data = await res.json();
  if(data.error) throw new Error(data.error.message || 'API_ERROR');
  return data;
}

function parseChannelInput(input){
  input = input.trim();
  let m = input.match(/youtube\.com\/@([a-zA-Z0-9_.-]+)/);
  if(m) return { type: 'handle', value: '@' + m[1] };
  m = input.match(/youtube\.com\/channel\/(UC[a-zA-Z0-9_-]{22})/);
  if(m) return { type: 'id', value: m[1] };
  if(/^UC[a-zA-Z0-9_-]{22}$/.test(input)) return { type: 'id', value: input };
  return { type: 'handle', value: '@' + input.replace(/^@/, '') };
}

async function resolveChannel(parsed){
  const param = parsed.type === 'handle'
    ? `forHandle=${encodeURIComponent(parsed.value)}`
    : `id=${parsed.value}`;
  const data = await apiGet(`https://www.googleapis.com/youtube/v3/channels?part=contentDetails,snippet&${param}`);
  if(!data.items || data.items.length === 0) throw new Error('CHANNEL_NOT_FOUND');
  const item = data.items[0];
  return {
    channelId: item.id,
    title: item.snippet.title,
    uploadsPlaylistId: item.contentDetails.relatedPlaylists.uploads
  };
}

async function fetchAllPlaylistItems(playlistId, maxItems){
  let items = [];
  let pageToken = '';
  while(items.length < maxItems){
    const pageParam = pageToken ? `&pageToken=${pageToken}` : '';
    const data = await apiGet(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&maxResults=50&playlistId=${playlistId}${pageParam}`);
    items = items.concat(data.items || []);
    pageToken = data.nextPageToken;
    if(!pageToken) break;
  }
  return items.slice(0, maxItems);
}

async function fetchDurationsMap(videoIds){
  const map = {};
  for(let i = 0; i < videoIds.length; i += 50){
    const chunk = videoIds.slice(i, i + 50);
    if(chunk.length === 0) continue;
    const data = await apiGet(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id=${chunk.join(',')}`);
    (data.items || []).forEach(it => { map[it.id] = parseISODuration(it.contentDetails.duration); });
  }
  return map;
}

async function importChannelShorts(inputValue, onProgress){
  onProgress('Menghubungkan ke channel...');
  const parsed = parseChannelInput(inputValue);
  const channel = await resolveChannel(parsed);
  onProgress(`Mengambil daftar video dari "${channel.title}"...`);
  const playlistItems = await fetchAllPlaylistItems(channel.uploadsPlaylistId, 200);
  const videoIds = playlistItems.map(pi => pi.contentDetails.videoId);
  onProgress(`Memeriksa ${videoIds.length} video untuk menemukan Shorts...`);
  const durations = await fetchDurationsMap(videoIds);
  const shorts = playlistItems.filter(pi => durations[pi.contentDetails.videoId] <= 180);
  let addedCount = 0;
  shorts.forEach(pi => {
    const id = pi.contentDetails.videoId;
    if(!videos.find(v => v.id === id)){
      videos.push({ id, title: pi.snippet.title, addedAt: Date.now(), fromChannel: channel.channelId });
      addedCount++;
    }
  });
  await setVal('videos-list', videos);
  let channels = await getVal('channels-list', []);
  const idx = channels.findIndex(c => c.channelId === channel.channelId);
  const entry = { channelId: channel.channelId, title: channel.title, uploadsPlaylistId: channel.uploadsPlaylistId, lastSyncedAt: Date.now() };
  if(idx >= 0) channels[idx] = entry; else channels.push(entry);
  await setVal('channels-list', channels);
  return { channel, addedCount, totalShorts: shorts.length };
}

// ---------- feed rendering ----------
let videos = [];
let displayOrder = [];

function shuffleArray(arr){
  const copy = arr.slice();
  for(let i = copy.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function positionIndicatorHtml(i, total){
  if(total <= 1) return '';
  if(total <= 12){
    return `<div class="dots">${Array.from({length: total}).map((_,j)=>`<div class="d ${j===i?'active':''}"></div>`).join('')}</div>`;
  }
  const pct = total === 1 ? 0 : (i / (total - 1)) * 100;
  return `<div class="dots-track"><div class="dots-marker" style="top:${pct}%"></div></div>`;
}

// ---------- daily time limit state ----------
let dailyLimitMinutes = 45;
let usage = { date: todayStr(), usedSeconds: 0 };
let extra = { date: todayStr(), minutes: 0 };
let overlayOpen = false;
let locked = false;
let timerHandle = null;
let soundOn = false;

function toggleSound(){
  soundOn = !soundOn;
  setVal('sound-on', soundOn);
  const btn = document.getElementById('soundBtn');
  if(btn) btn.textContent = soundOn ? '🔊' : '🔇';
  document.querySelectorAll('.slide iframe').forEach(f=>{
    const slide = f.closest('.slide');
    if(slide) f.src = buildEmbedSrc(slide.dataset.id);
  });
}

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function effectiveLimitSeconds(){
  return (dailyLimitMinutes + extra.minutes) * 60;
}

async function loadTimeState(){
  dailyLimitMinutes = await getVal('daily-limit-minutes', 45);
  const savedUsage = await getVal('usage-today', { date: todayStr(), usedSeconds: 0 });
  usage = savedUsage.date === todayStr() ? savedUsage : { date: todayStr(), usedSeconds: 0 };
  const savedExtra = await getVal('extra-today', { date: todayStr(), minutes: 0 });
  extra = savedExtra.date === todayStr() ? savedExtra : { date: todayStr(), minutes: 0 };
}

function startTimer(){
  if(timerHandle) clearInterval(timerHandle);
  timerHandle = setInterval(async ()=>{
    if(overlayOpen || locked || videos.length === 0) return;
    usage.usedSeconds++;
    if(usage.usedSeconds % 5 === 0) await setVal('usage-today', usage);
    if(usage.usedSeconds >= effectiveLimitSeconds()){
      await setVal('usage-today', usage);
      lockKidView();
    }
  }, 1000);
}

function lockKidView(){
  locked = true;
  document.getElementById('feed').innerHTML = `
    <div class="empty locked">
      <div class="emoji">⏳</div>
      <h2 class="display">Waktu nonton hari ini sudah habis</h2>
      <p>Sampai jumpa besok! Kalau perlu tambahan waktu, minta Ayah/Ibu buka Mode Orang Tua.</p>
    </div>`;
}

function renderEmpty(){
  document.getElementById('feed').innerHTML = `
    <div class="empty">
      <div class="emoji">🎬</div>
      <h2 class="display">Belum ada video</h2>
      <p>Minta Ayah/Ibu buka <b>Mode Orang Tua</b> (ikon gembok di kanan bawah) untuk menambahkan video pilihan.</p>
    </div>`;
}

function renderCurrentKidView(){
  if(usage.usedSeconds >= effectiveLimitSeconds()){ lockKidView(); return; }
  locked = false;
  renderFeed();
}

function renderFeed(){
  const feed = document.getElementById('feed');
  if(videos.length === 0){ renderEmpty(); return; }
  displayOrder = shuffleArray(videos);
  feed.innerHTML = displayOrder.map((v,i) => `
    <div class="slide" data-id="${v.id}" data-index="${i}">
      <img class="thumb" src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" alt="">
      <div class="badge"><span class="dot"></span>Disetujui Ayah/Ibu</div>
      ${positionIndicatorHtml(i, displayOrder.length)}
    </div>
  `).join('') + `
    <div class="end-slide slide" style="background:var(--ink);">
      <div class="empty" style="height:auto;">
        <div class="emoji">🎉</div>
        <h2 class="display">Sudah nonton semua video pilihan!</h2>
        <p>Video baru akan ditambahkan oleh Ayah/Ibu. Kalau masih mau, boleh diputar ulang dari awal.</p>
        <button class="replay-btn" id="replayBtn">🔁 Putar dari awal</button>
      </div>
    </div>
  `;
  setupObserver();
  const replayBtn = document.getElementById('replayBtn');
  if(replayBtn) replayBtn.addEventListener('click', () => {
    feed.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

let currentObserver = null;

function buildEmbedSrc(id){
  return `https://www.youtube.com/embed/${id}?autoplay=1&mute=${soundOn ? 0 : 1}&loop=1&playlist=${id}&modestbranding=1&rel=0&playsinline=1`;
}

function setupObserver(){
  if(currentObserver) currentObserver.disconnect();
  const slides = document.querySelectorAll('.slide');
  currentObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      const slide = entry.target;
      const id = slide.dataset.id;
      if(entry.isIntersecting && entry.intersectionRatio > 0.6){
        if(!slide.querySelector('iframe')){
          const iframe = document.createElement('iframe');
          iframe.src = buildEmbedSrc(id);
          iframe.allow = "autoplay; encrypted-media; picture-in-picture";
          iframe.allowFullscreen = true;
          slide.appendChild(iframe);
        }
      } else {
        const existing = slide.querySelector('iframe');
        if(existing) existing.remove();
      }
    });
  }, { threshold: [0, 0.6] });
  slides.forEach(s => currentObserver.observe(s));
}

// ---------- Parent mode overlay ----------
const root = document.getElementById('overlayRoot');
let pinBuffer = '';

async function openParentFlow(){
  overlayOpen = true;
  const savedPin = await getVal('parent-pin', null);
  if(!savedPin){
    showSetPin();
  } else {
    showEnterPin(savedPin);
  }
}

function pinDotsHtml(len, filled){
  let out = '';
  for(let i=0;i<len;i++) out += `<span class="${i<filled?'filled':''}"></span>`;
  return out;
}

function keypadHtml(){
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  return `<div class="keypad">${keys.map(k=>{
    if(k==='') return `<div></div>`;
    return `<button data-key="${k}">${k}</button>`;
  }).join('')}</div>`;
}

function showSetPin(){
  pinBuffer = '';
  root.innerHTML = `
    <div class="overlay">
      <div class="sheet">
        <div class="sheet-head">
          <button class="close-x" id="closeBtn">×</button>
          <h2 class="display">Buat PIN Orang Tua</h2>
          <p class="sub">Buat PIN 4 digit supaya hanya Ayah/Ibu yang bisa mengubah daftar video.</p>
        </div>
        <div class="pin-dots" id="pinDots">${pinDotsHtml(4,0)}</div>
        <div class="err" id="pinErr"></div>
        ${keypadHtml()}
      </div>
    </div>`;
  bindPinKeypad(async (val)=>{
    // first entry -> confirm
    const firstPin = val;
    pinBuffer = '';
    root.querySelector('.sheet').innerHTML = `
      <div class="sheet-head">
        <button class="close-x" id="closeBtn">×</button>
        <h2 class="display">Ulangi PIN</h2>
        <p class="sub">Ketik ulang PIN yang sama untuk konfirmasi.</p>
      </div>
      <div class="pin-dots" id="pinDots">${pinDotsHtml(4,0)}</div>
      <div class="err" id="pinErr"></div>
      ${keypadHtml()}`;
    bindCloseBtn();
    bindPinKeypad(async (confirmVal)=>{
      if(confirmVal === firstPin){
        await setVal('parent-pin', firstPin);
        showParentPanel();
      } else {
        document.getElementById('pinErr').textContent = 'PIN tidak sama, coba lagi.';
        setTimeout(showSetPin, 900);
      }
    });
  });
  bindCloseBtn();
}

function showEnterPin(correctPin){
  pinBuffer = '';
  root.innerHTML = `
    <div class="overlay">
      <div class="sheet">
        <div class="sheet-head">
          <button class="close-x" id="closeBtn">×</button>
          <h2 class="display">Mode Orang Tua</h2>
          <p class="sub">Masukkan PIN untuk mengatur video.</p>
        </div>
        <div class="pin-dots" id="pinDots">${pinDotsHtml(4,0)}</div>
        <div class="err" id="pinErr"></div>
        ${keypadHtml()}
      </div>
    </div>`;
  bindPinKeypad((val)=>{
    if(val === correctPin){ showParentPanel(); }
    else{
      document.getElementById('pinErr').textContent = 'PIN salah, coba lagi.';
      pinBuffer='';
      document.getElementById('pinDots').innerHTML = pinDotsHtml(4,0);
    }
  });
  bindCloseBtn();
}

function bindPinKeypad(onComplete){
  const dotsEl = () => document.getElementById('pinDots');
  root.querySelectorAll('[data-key]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.key;
      if(key === '⌫'){ pinBuffer = pinBuffer.slice(0,-1); }
      else if(pinBuffer.length < 4){ pinBuffer += key; }
      if(dotsEl()) dotsEl().innerHTML = pinDotsHtml(4, pinBuffer.length);
      if(pinBuffer.length === 4){
        const val = pinBuffer;
        setTimeout(()=>onComplete(val), 120);
      }
    });
  });
}

function bindCloseBtn(){
  const btn = document.getElementById('closeBtn');
  if(btn) btn.addEventListener('click', closeOverlay);
}

function closeOverlay(){
  root.innerHTML='';
  overlayOpen = false;
  renderCurrentKidView();
}

function progressPercent(){
  return Math.min(100, Math.round((usage.usedSeconds / effectiveLimitSeconds()) * 100));
}

function timeLimitSectionHtml(){
  const presets = [15,30,45,60];
  const usedMin = Math.floor(usage.usedSeconds / 60);
  const totalMin = dailyLimitMinutes + extra.minutes;
  const pct = progressPercent();
  return `
    <div class="section-label">BATAS WAKTU HARIAN</div>
    <div class="preset-row">
      ${presets.map(p => `<button class="preset-btn ${p===dailyLimitMinutes?'active':''}" data-preset="${p}">${p} mnt</button>`).join('')}
    </div>
    <div class="progress-wrap">
      <div class="progress-text">Terpakai hari ini: ${usedMin} dari ${totalMin} menit</div>
      <div class="progress-bar-bg"><div class="progress-bar-fill ${pct>=100?'over':''}" style="width:${pct}%"></div></div>
    </div>
    <button class="quick-add-btn" id="addTimeBtn">+ Tambah 10 menit untuk hari ini</button>
  `;
}

function bindTimeControls(){
  root.querySelectorAll('[data-preset]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      dailyLimitMinutes = parseInt(btn.dataset.preset,10);
      await setVal('daily-limit-minutes', dailyLimitMinutes);
      refreshTimeSection();
    });
  });
  const addBtn = document.getElementById('addTimeBtn');
  if(addBtn) addBtn.addEventListener('click', async ()=>{
    extra.minutes += 10;
    await setVal('extra-today', extra);
    if(usage.usedSeconds < effectiveLimitSeconds()) locked = false;
    refreshTimeSection();
  });
}

function refreshTimeSection(){
  const wrap = document.getElementById('timeSection');
  if(wrap){ wrap.innerHTML = timeLimitSectionHtml(); bindTimeControls(); }
}

function apiKeySectionHtml(currentKey){
  return `
    <div class="section-label">YOUTUBE API KEY</div>
    <input type="text" id="apiKeyInput" placeholder="Tempel API Key di sini" value="${currentKey || ''}">
    <div class="hint">Dipakai untuk menarik daftar video dari sebuah channel. <a href="https://console.cloud.google.com/" target="_blank" style="color:var(--coral);">Cara membuatnya di sini</a>.</div>
  `;
}

function channelSectionHtml(channels){
  return `
    <div class="section-label">TAMBAH SEMUA SHORTS DARI CHANNEL</div>
    <input type="text" id="channelInput" placeholder="youtube.com/@namachannel atau @namachannel">
    <button class="btn-secondary" id="importChannelBtn">Ambil Shorts dari Channel</button>
    <div class="status-text" id="importStatus"></div>
    ${channels.length ? `<div id="channelListWrap">${channels.map(channelItemHtml).join('')}</div>` : ''}
  `;
}

function channelItemHtml(c){
  const days = Math.floor((Date.now() - c.lastSyncedAt) / 86400000);
  const lastSync = days === 0 ? 'hari ini' : `${days} hari lalu`;
  return `
    <div class="channel-item" data-channel="${c.channelId}">
      <div>
        <div class="ch-title">${c.title}</div>
        <div class="ch-sub">Sync terakhir: ${lastSync}</div>
      </div>
      <button data-resync="${c.channelId}" title="Sync ulang">🔄</button>
      <button data-remove-channel="${c.channelId}" title="Hapus dari daftar channel">🗑️</button>
    </div>
  `;
}

async function bindChannelAndApiControls(){
  const apiInput = document.getElementById('apiKeyInput');
  if(apiInput){
    apiInput.addEventListener('input', async ()=>{
      await setVal('youtube-api-key', apiInput.value.trim());
    });
  }
  const importBtn = document.getElementById('importChannelBtn');
  if(importBtn){
    importBtn.addEventListener('click', () => runChannelImport(document.getElementById('channelInput').value));
  }
  root.querySelectorAll('[data-resync]').forEach(btn=>{
    btn.addEventListener('click', () => runChannelImport(btn.dataset.resync, true));
  });
  root.querySelectorAll('[data-remove-channel]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      let channels = await getVal('channels-list', []);
      channels = channels.filter(c => c.channelId !== btn.dataset.removeChannel);
      await setVal('channels-list', channels);
      refreshChannelSection();
    });
  });
}

async function runChannelImport(inputValue, isResync){
  const statusEl = document.getElementById('importStatus');
  const apiKey = await getVal('youtube-api-key', '');
  if(!apiKey){
    statusEl.textContent = 'Isi dulu YouTube API Key di bagian atas.';
    statusEl.className = 'status-text error';
    return;
  }
  statusEl.className = 'status-text';
  try{
    const result = await importChannelShorts(inputValue, (msg) => { statusEl.textContent = msg; });
    statusEl.textContent = `Selesai! ${result.addedCount} Shorts baru ditambahkan (dari ${result.totalShorts} Shorts ditemukan di "${result.channel.title}").`;
    statusEl.className = 'status-text success';
    if(!isResync) document.getElementById('channelInput').value = '';
    document.getElementById('listWrap').innerHTML = renderVideoList();
    bindRemoveButtons();
    root.querySelector('.list-title span').textContent = `DAFTAR VIDEO DISETUJUI (${videos.length})`;
    refreshChannelSection();
    renderCurrentKidView();
  }catch(e){
    const msg = e.message === 'CHANNEL_NOT_FOUND'
      ? 'Channel tidak ditemukan. Cek lagi link atau nama handle-nya.'
      : e.message === 'NO_KEY'
        ? 'Isi dulu YouTube API Key di bagian atas.'
        : `Gagal: ${e.message}`;
    statusEl.textContent = msg;
    statusEl.className = 'status-text error';
  }
}

async function refreshChannelSection(){
  const channels = await getVal('channels-list', []);
  const wrap = document.getElementById('channelListWrap');
  if(wrap) wrap.outerHTML = channels.length ? `<div id="channelListWrap">${channels.map(channelItemHtml).join('')}</div>` : '<div id="channelListWrap"></div>';
  else {
    const section = document.getElementById('channelSection');
    if(section){ section.innerHTML = channelSectionHtml(channels); }
  }
  bindChannelAndApiControls();
}

async function showParentPanel(){
  const apiKey = await getVal('youtube-api-key', '');
  const channels = await getVal('channels-list', []);
  root.innerHTML = `
    <div class="overlay">
      <div class="sheet">
        <div class="sheet-head">
          <button class="close-x" id="closeBtn">×</button>
          <h2 class="display">Kelola Video</h2>
          <p class="sub">Tempel link YouTube Shorts / video yang sudah disetujui.</p>
        </div>
        <label>Link YouTube</label>
        <input type="text" id="urlInput" placeholder="https://youtube.com/shorts/...">
        <div class="err" id="addErr"></div>
        <button class="btn-primary" id="addBtn">Tambahkan ke daftar</button>
        <div class="hint">Bisa tempel link Shorts, video biasa, atau youtu.be. Anak hanya akan melihat video di daftar ini.</div>
        ${apiKeySectionHtml(apiKey)}
        <div id="channelSection">${channelSectionHtml(channels)}</div>
        <div class="list-title"><span>DAFTAR VIDEO DISETUJUI (${videos.length})</span></div>
        <div id="listWrap">${renderVideoList()}</div>
        <div id="timeSection">${timeLimitSectionHtml()}</div>
        <button class="btn-ghost" id="changePinBtn">Ubah PIN</button>
      </div>
    </div>`;
  bindCloseBtn();
  document.getElementById('addBtn').addEventListener('click', addVideoFromInput);
  document.getElementById('changePinBtn').addEventListener('click', showSetPin);
  bindRemoveButtons();
  bindTimeControls();
  bindChannelAndApiControls();
}

function renderVideoList(){
  if(videos.length === 0) return `<p style="font-size:13px;color:#9098a5;">Belum ada video ditambahkan.</p>`;
  return videos.map(v => `
    <div class="video-item" data-id="${v.id}">
      <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" alt="">
      <div class="vid-id">${v.title ? v.title.slice(0,40) : v.id}</div>
      <button data-remove="${v.id}">🗑️</button>
    </div>
  `).join('');
}

function bindRemoveButtons(){
  root.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.remove;
      videos = videos.filter(v => v.id !== id);
      await setVal('videos-list', videos);
      document.getElementById('listWrap').innerHTML = renderVideoList();
      root.querySelector('.list-title span').textContent = `DAFTAR VIDEO DISETUJUI (${videos.length})`;
      bindRemoveButtons();
      renderFeed();
    });
  });
}

async function addVideoFromInput(){
  const input = document.getElementById('urlInput');
  const id = extractId(input.value);
  const errEl = document.getElementById('addErr');
  if(!id){
    errEl.textContent = 'Link tidak dikenali. Pastikan itu link YouTube yang valid.';
    return;
  }
  if(videos.find(v => v.id === id)){
    errEl.textContent = 'Video ini sudah ada di daftar.';
    return;
  }
  errEl.textContent = '';
  videos.push({ id, addedAt: Date.now() });
  await setVal('videos-list', videos);
  input.value = '';
  document.getElementById('listWrap').innerHTML = renderVideoList();
  root.querySelector('.list-title span').textContent = `DAFTAR VIDEO DISETUJUI (${videos.length})`;
  bindRemoveButtons();
  renderFeed();
}

document.getElementById('lockBtn').addEventListener('click', openParentFlow);
document.getElementById('soundBtn').addEventListener('click', toggleSound);

// ---------- init ----------
(async function init(){
  videos = await getVal('videos-list', []);
  soundOn = await getVal('sound-on', false);
  document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  await loadTimeState();
  renderCurrentKidView();
  startTimer();
})();

// ---------- PWA: install prompt ----------
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').style.display = 'block';
});
document.getElementById('installBtn').addEventListener('click', async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBtn').style.display = 'none';
});
window.addEventListener('appinstalled', ()=>{
  document.getElementById('installBtn').style.display = 'none';
});

// ---------- PWA: service worker ----------
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
</body>
</html>
